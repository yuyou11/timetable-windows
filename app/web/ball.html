<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>时间规划表 · 悬浮窗</title>
  <style>
    /* ======================================================================
       桌面悬浮窗 —— 两种形态，一个固定尺寸的窗口

         ┌─────────────────────────────┐      ┌──┐
         │ ● 前往教室        还剩 2 分 │      │◀ │
         │   接着 14:00 第 5-6 节      │  ⇄   │  │   ← 贴边收起
         │   [打开主窗口]  [隐藏]      │      │  │
         └─────────────────────────────┘      └──┘
              展开（自由浮动 / 悬停时）          收起（贴左右边时）

       ## 收起是怎么实现的（重要：这个窗口永不 resize）

       窗口尺寸**恒定**（270×104，Python 创建后就不再改）。卡片左右各留
       13px 的空白把手区，收起时 Python 把**整窗平移**到屏幕外、只留把手那条；
       悬停再平移回来。所以：

         · 页面内容从头到尾都是完整渲染的，没有任何"展开到一半还没画出来"的
           区域 —— 旧版逐帧 resize 时露出灰底的问题从根上不存在了
         · 收起/展开动画 = 纯窗口移动，CSS 里**没有**动画时间线要配合，
           唯一的过渡是露出条上箭头的淡入淡出（120ms，纯装饰）
         · 形态由 <body> 上的 class 决定，Python 那边算好之后调 applyDock() 切换

       ## 尺寸必须和 app/dock.py 里的常量对上

         WINDOW_W = 270   WINDOW_H = 104   SLIDE_W = 13

       对账关系：#panel 的左右 padding 24 = SLIDE_W(13) + 11，
       内容列宽 = 270 − 48 = 222。改一边记得改另一边（有测试核对）。

       ## 展开时窗口并不全部进来

       收起 = 整窗滑出屏幕外、只留把手那条；展开 = 只滑到**内容贴住
       屏幕边缘**为止 —— 靠屏幕边的那条把手区留在屏外，滑出距离正好
       是内容区宽度。所以展开态的卡片看起来是贴边的（和旧版一样），
        只是在内侧多出一段 13px 的空白把手区。

       ## 箭头为什么用 CSS 三角形而不是「◀▶」字符

       因为字符依赖字体里有没有那个字形 —— 国产 ROM 上就翻过车
       （详见手机版 README）。CSS 的 border 三角形是纯几何，到哪都一样。
       ====================================================================== */

    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --surface: #ffffff;
      --border: #dfe3e8;
      --text: #1a1d23;
      --text-dim: #6b7280;
      --btn-bg: #fafbfc;
      --btn-border: #e4e7ec;
      --hover-bg: #f0f2f5;

      /* 页面里那圈 1px 边框的圆角半径。

         窗口本身也是圆的，但那是 Windows 裁的（app/winutil.py 的
         set_rounded_corners），半径由系统定、我们调不了（实测约 10 逻辑像素，
         所以卡片这个 10 正好能对上）。

         ⚠️ 这两个值必须和 app/dock.py 的 CORNER_RADIUS_CARD / CORNER_RADIUS_TAB
         一致 —— 它们是两份独立写下的数据，没有任何机制保证相等。
         tests/test_dock.py 里有一条测试会读这个文件来核对，
         改一边忘了另一边，跑测试会当场报出来。 */
      --radius-card: 10px;
      --radius-tab: 6px;
    }

    /* 主题三档（设置页里选）：跟随系统 / 始终浅色 / 始终深色。
       和 style.css 是同一套约定 —— 跟随系统靠 @media，强制档靠
       `<html data-theme="...">`（启动时由 Python 推过来）。
       深色那套写了两遍，理由见 style.css 里的同段说明。 */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme='light']) {
        --surface: #181b21;
        --border: #2f3540;
        --text: #e8eaed;
        --text-dim: #9aa1ac;
        --btn-bg: #23272f;
        --btn-border: #2f3540;
        --hover-bg: #2a2f38;
      }
    }

    :root[data-theme='dark'] {
      --surface: #181b21;
      --border: #2f3540;
      --text: #e8eaed;
      --text-dim: #9aa1ac;
      --btn-bg: #23272f;
      --btn-border: #2f3540;
      --hover-bg: #2a2f38;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      /* 和卡片同色：万一窗口没被裁好，露出来的也是同一个颜色 */
      background: var(--surface);
      font-family: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
      user-select: none;
      -webkit-user-select: none;
      cursor: default;
    }

    /* ====================== 卡片（唯一的内容层） ======================

       #panel **常驻显示**：收起时它并没有被藏起来，只是整窗滑到了
       屏幕外、露出它左右把手区中的一条。所以这里没有 layout-tab/layout-card
       的 display 切换 —— 布局 class 只管「箭头覆盖层显不显示」。

       左右 padding 的 24 = SLIDE_W(13) + 11：多出来的 13 就是收起时
       露在屏幕外的把手区。内容列宽因此和旧版完全一致（222px），
       卡片只是两侧各多出一条把手区。 */

    #panel {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 3px;
      width: 100%;
      height: 100%;
      padding: 9px 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      /* 半径见 :root 里 --radius-card 的说明 */
      border-radius: var(--radius-card);
      cursor: grab;
      overflow: hidden;
    }

    body.layout-card #panel:active { cursor: grabbing; }

    .row1 { display: flex; align-items: center; gap: 6px; min-width: 0; }

    #dot {
      flex: 0 0 7px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #94a3b8;
    }

    #now {
      flex: 1;
      min-width: 0;
      font-size: 13.5px;
      font-weight: 650;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #remain {
      flex: 0 0 auto;
      font-size: 15px;
      font-weight: 700;
      /* 跟随设置里的主色调（Python 会把算好的色值推给 __applyAccent）；
         没自定义时回落到原来的蓝。 */
      color: var(--accent, #2563eb);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    #remain i {
      font-size: 10.5px;
      font-style: normal;
      font-weight: 500;
      margin-left: 1px;
      opacity: .8;
    }

    #next {
      font-size: 11.5px;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding-left: 13px;
    }

    .row3 { display: flex; gap: 6px; margin-top: 4px; padding-left: 13px; }

    .row3 button {
      flex: 1;
      padding: 4px 0;
      border: 1px solid var(--btn-border);
      border-radius: 6px;
      background: var(--btn-bg);
      color: var(--text-dim);
      font: inherit;
      font-size: 11.5px;
      cursor: pointer;
      /* 按钮文字强制单行：窗口极窄时（理论上进不到了，留作兜底）
         文字折行比截断更难看。 */
      white-space: nowrap;
      overflow: hidden;
      transition: background .15s, border-color .15s;
    }

    .row3 button:hover { background: var(--hover-bg); }

    /* ====================== 收起态的把手（露出条） ======================

       收起时露出来的那条就是 #panel 自己的边缘（同一张卡片的留白区，
       连着边框和圆角），#tab 只是叠在上面的**透明覆盖层**：
       负责箭头、hover 高亮和点击目标。

       只在贴边收起时显示。方向别搞反：贴**右**边时窗口往右滑出屏幕，
       留在屏幕里的是页面**左侧**那条 → 覆盖层放左边；
       贴左边镜像。 */

    #tab {
      display: none;
      position: absolute;
      top: 1px;
      bottom: 1px;
      width: 12px;              /* SLIDE_W − 1：给面板的 1px 边框让位，别把它盖住 */
      place-items: center;
      cursor: pointer;
      /* hover 高亮的圆角：和收起态对账的 --radius-tab 保持一份契约 */
      border-radius: var(--radius-tab);
    }

    body.layout-tab #tab { display: grid; }
    body.dock-right #tab { left: 1px; }
    body.dock-left  #tab { right: 1px; }

    #tab:hover { background: var(--hover-bg); }

    /* --- CSS 三角形箭头，指向"拉出来的方向" ---
       Python 在动画一开始就把 body 切到目标形态，所以箭头的出现/消失
       走这个 120ms 的淡入淡出，正好叠在 160ms 的滑出/滑入上。 */

    .arrow {
      width: 0;
      height: 0;
      border: 6px solid transparent;
      transition: opacity 120ms ease-out;
    }

    /* 贴在右边 → 面板往左滑出来 → 箭头朝左 */
    body.dock-right .arrow {
      border-right: 7px solid var(--text-dim);
      border-left: 0;
    }

    /* 贴在左边 → 往右滑出来 → 箭头朝右 */
    body.dock-left .arrow {
      border-left: 7px solid var(--text-dim);
      border-right: 0;
    }

    /* 悬停时箭头亮一点，暗示可以点（跟主色调走，理由见 #remain） */
    #tab:hover .arrow {
      border-right-color: var(--accent, #2563eb);
      border-left-color: var(--accent, #2563eb);
      border-top-color: var(--accent, #2563eb);
      border-bottom-color: var(--accent, #2563eb);
    }

    /* 提醒时的跳动由 Python 调 window.pulse() 触发 */
    @keyframes pulse-kf {
      0%, 100% { transform: scale(1); }
      45%      { transform: scale(1.04); }
    }

    #panel.pulse { animation: pulse-kf .55s ease-in-out 2; }
  </style>
  <script>
    /* 主题的强制档。和 index.html 里那段一模一样 —— 三个窗口是三个独立页面，
       拿不到同一份全局，只能各写一份（同 KIND_COLOR 的处理方式）。
       跟随系统是纯 CSS（@media）就成立的，这里只管「始终浅色/深色」。 */
    window.__applyTheme = function (t) {
      if (t === 'light' || t === 'dark') {
        document.documentElement.setAttribute('data-theme', t);
      }
    };

    /* 自定义主色调。Python 按当前深浅档把色值算好推过来（app/skin.py），
       这里只管设上；值为 null（用户恢复默认）就摘掉，回到回落值。
       ⚠️ 悬浮窗只吃主色调，不吃透明度和背景图 —— 窗口底色创建时就定死，
       半透明卡片会在圆角处露出一圈实色（skin.py 开头有完整说明）。 */
    window.__applyAccent = function (s) {
      if (!s) return;
      var root = document.documentElement.style;
      if (s.accent) root.setProperty('--accent', s.accent);
      else root.removeProperty('--accent');
    };
  </script>
</head>
<body class="layout-card">

  <div id="panel">
    <div class="row1">
      <span id="dot"></span>
      <span id="now">正在加载…</span>
      <span id="remain">--<i>分</i></span>
    </div>
    <div id="next">—</div>
    <div class="row3">
      <button id="btnMain">打开主窗口</button>
      <button id="btnClose" title="关闭悬浮窗（可在主窗口设置里重新打开）">关闭</button>
    </div>
  </div>

  <div id="tab" title="移到边缘自动隐藏">
    <span class="arrow"></span>
  </div>

<script src="ball.js"></script>
</body>
</html>
