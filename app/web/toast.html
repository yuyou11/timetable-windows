<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>提醒</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* 主题三档（设置页里选）：跟随系统 / 始终浅色 / 始终深色。
       和 style.css 同一套约定 —— 跟随系统靠 @media，强制档靠
       `<html data-theme="...">`。深色那套写了两遍，理由见 style.css。
       这里用变量而不是把色值散在各选择器上：否则强制档要在四个选择器上
       各复制一遍，漏一处就是「深色下发白的一块」。 */
    :root {
      --surface: #ffffff;
      --border: #dfe3e8;
      --text: #1a1d23;
      --text-dim: #6b7280;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme='light']) {
        --surface: #181b21;
        --border: #2f3540;
        --text: #e8eaed;
        --text-dim: #9aa1ac;
      }
    }

    :root[data-theme='dark'] {
      --surface: #181b21;
      --border: #2f3540;
      --text: #e8eaed;
      --text-dim: #9aa1ac;
    }

    html, body {
      width: 100%;
      height: 100%;
      /* 不透明背景。原来是 transparent，靠窗口透明来"浮"在桌面上，
         但 WebView2 在部分环境下不会真正渲染透明，会露出一个突兀的方框。
         现在改成不透明的小卡片，窗口底色和卡片一致，不依赖透明能力。

         ⚠️ 这个 --surface 必须和 Python 侧 screen._bg_color() 返回的
         两个色值相等 —— 对不上就在窗口的四个圆角处露出一圈反色。 */
      background: var(--surface);
      overflow: hidden;
      font-family: "Microsoft YaHei", "PingFang SC", -apple-system, sans-serif;
      user-select: none;
    }

    #card {
      width: 100%;
      height: 100%;
      display: flex;
      gap: 11px;
      align-items: flex-start;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      opacity: 0;
      transition: opacity .2s ease;
    }

    #card.show { opacity: 1; }

    /* 左侧竖条：和课表里的颜色体系一致，一眼看出是「上课」还是别的 */
    #bar {
      flex: 0 0 4px;
      align-self: stretch;
      border-radius: 2px;
      background: #ef4444;
    }

    #body { flex: 1; min-width: 0; }

    #title {
      font-size: 14.5px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.35;
      word-break: break-word;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    #text {
      margin-top: 3px;
      font-size: 12px;
      color: var(--text-dim);
      font-variant-numeric: tabular-nums;
    }
  </style>
  <script>
    /* 主题的强制档。和 index.html 里那段一模一样 —— 三个窗口是三个独立页面，
       拿不到同一份全局，只能各写一份（同 KIND_COLOR 的处理方式）。
       跟随系统是纯 CSS（@media）就成立的，这里只管「始终浅色/深色」。 */
    window.__applyTheme = function (t) {
      if (t === 'light' || t === 'dark') {
        document.documentElement.setAttribute('data-theme', t);
      }
    };
  </script>
</head>
<body>
  <div id="card">
    <div id="bar"></div>
    <div id="body">
      <div id="title">—</div>
      <div id="text">—</div>
    </div>
  </div>

  <script>
    /* 提示条。
       窗口是提前创建好藏起来的，到点由 Python 调 showToast() 填内容再显示。

       每次显示都重新触发一次入场动画 —— 直接改内容的话，
       用户会看到文字「跳」一下，没有「弹出来」的感觉。 */
    window.showToast = function (data) {
      const card = document.getElementById('card');
      document.getElementById('title').textContent = data.title || '';
      document.getElementById('text').textContent = data.body || '';

      card.classList.remove('show');
      // 强制浏览器重新计算样式，否则连续两次加同一个 class 不会重放动画
      void card.offsetWidth;
      card.classList.add('show');
    };

    /* 注意：pulse() 是**悬浮窗**那边的东西（ball.js 里定义）。
       这里不要再定义一遍 —— 两个窗口共用同一个 js_api 对象，
       但各自有独立的 window，所以同名函数不会互相覆盖。
       之前这里也写了一个 pulse 去操作 #ball，而 toast.html 里
       根本没有那个元素，属于复制粘贴留下的死代码。 */
  </script>
</body>
</html>
